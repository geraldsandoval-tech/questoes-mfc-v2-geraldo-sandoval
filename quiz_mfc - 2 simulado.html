<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado MFC — Medicina de Família e Comunidade</title>
<style>
:root{
  --bg:#0a0e14;
  --bg-panel:#111826;
  --bg-panel-2:#161f2e;
  --border:#243146;
  --text:#e6edf5;
  --text-dim:#93a4bd;
  --text-faint:#5d6b83;
  --accent:#2dd4bf;
  --accent-dim:#0f766e;
  --accent-glow:rgba(45,212,191,0.15);
  --ok:#34d399;
  --ok-dim:#064e3b;
  --bad:#f87171;
  --bad-dim:#450a0a;
  --warn:#fbbf24;
  --radius:12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100%;
}
body{
  background-image:
    radial-gradient(circle at 15% 0%, rgba(45,212,191,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(45,212,191,0.04), transparent 40%);
  background-attachment:fixed;
}
.app{
  max-width:920px;
  margin:0 auto;
  padding:20px 16px 60px;
}
/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:16px;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.brand .title{
  font-weight:700;
  font-size:15px;
  letter-spacing:0.3px;
}
.brand .subtitle{
  font-size:11.5px;
  color:var(--text-dim);
  letter-spacing:0.4px;
}
.brand .dot{color:var(--accent);}
.header-actions{
  display:flex;
  gap:8px;
}
/* BUTTONS */
button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  border-radius:8px;
  font-size:13.5px;
  font-weight:600;
  padding:9px 16px;
  transition:transform .08s ease, filter .15s ease, background .15s ease;
}
button:active{transform:scale(0.97);}
button:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{
  background:var(--accent);
  color:#03211d;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-secondary{
  background:var(--bg-panel-2);
  color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover:not(:disabled){border-color:var(--accent-dim);}
.btn-ghost{
  background:transparent;
  color:var(--text-dim);
  border:1px solid var(--border);
}
.btn-ghost:hover:not(:disabled){color:var(--text);}
.btn-danger{
  background:transparent;
  color:var(--bad);
  border:1px solid rgba(248,113,113,0.35);
}
.btn-sm{padding:7px 12px;font-size:12.5px;}

/* INTRO SCREEN */
.intro{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:36px 28px;
  text-align:center;
}
.intro h1{
  font-size:22px;
  margin:0 0 8px;
}
.intro p{
  color:var(--text-dim);
  font-size:14.5px;
  line-height:1.6;
  max-width:560px;
  margin:0 auto 22px;
}
.intro-stats{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:28px;
}
.intro-stat{
  background:var(--bg-panel-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 20px;
  min-width:110px;
}
.intro-stat .num{
  font-size:22px;
  font-weight:800;
  color:var(--accent);
}
.intro-stat .lbl{
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:2px;
}
.intro-themes{
  text-align:left;
  background:var(--bg-panel-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 20px;
  margin:0 auto 26px;
  max-width:560px;
  font-size:12.5px;
  color:var(--text-dim);
  line-height:1.8;
  columns:2;
  column-gap:24px;
}
@media (max-width:560px){
  .intro-themes{columns:1;}
}

/* PROGRESS BAR */
.progress-wrap{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 18px;
  margin-bottom:14px;
}
.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  flex-wrap:wrap;
  gap:8px;
}
.progress-label{
  font-size:12.5px;
  color:var(--text-dim);
  font-weight:600;
  letter-spacing:0.3px;
}
.progress-legend{
  display:flex;
  gap:12px;
  font-size:11px;
  color:var(--text-faint);
}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
.bar-track{
  height:7px;
  background:var(--bg-panel-2);
  border-radius:6px;
  overflow:hidden;
  display:flex;
}
.bar-seg{height:100%;}

/* QUESTION CARD */
.card{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px 22px 20px;
  margin-bottom:14px;
}
.qnum{
  color:var(--text-faint);
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
}
.caso-box{
  background:var(--bg-panel-2);
  border-left:3px solid var(--accent-dim);
  border-radius:6px;
  padding:14px 16px;
  margin-bottom:16px;
  font-size:14.5px;
  line-height:1.65;
  color:var(--text);
}
.caso-label{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:0.6px;
  color:var(--text-faint);
  margin-bottom:6px;
  text-transform:uppercase;
}
.pergunta{
  font-size:16px;
  font-weight:600;
  line-height:1.5;
  margin-bottom:18px;
}
.opcoes{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:6px;
}
.opcao{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:13px 15px;
  background:var(--bg-panel-2);
  border:1.5px solid var(--border);
  border-radius:9px;
  cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
  font-size:14px;
  line-height:1.5;
}
.opcao:hover{border-color:var(--accent-dim);}
.opcao.selected{
  border-color:var(--accent);
  background:rgba(45,212,191,0.07);
}
.opcao.locked{cursor:default;}
.opcao.correta-reveal{
  border-color:var(--ok);
  background:rgba(52,211,153,0.08);
}
.opcao.incorreta-reveal{
  border-color:var(--bad);
  background:rgba(248,113,113,0.07);
}
.opcao-letra{
  flex:0 0 26px;
  height:26px;
  border-radius:50%;
  background:var(--border);
  color:var(--text-dim);
  font-weight:800;
  font-size:12.5px;
  display:flex;align-items:center;justify-content:center;
}
.opcao.selected .opcao-letra{background:var(--accent);color:#03211d;}
.opcao.correta-reveal .opcao-letra{background:var(--ok);color:#04220f;}
.opcao.incorreta-reveal .opcao-letra{background:var(--bad);color:#2a0505;}
.opcao-texto{flex:1;padding-top:2px;}
.opcao-icon{flex:0 0 auto;font-size:15px;padding-top:2px;}

/* FEEDBACK PANEL */
.feedback{
  margin-top:18px;
  border-radius:10px;
  padding:16px 18px;
  border:1px solid;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.feedback.correct{background:rgba(52,211,153,0.06);border-color:rgba(52,211,153,0.35);}
.feedback.incorrect{background:rgba(248,113,113,0.06);border-color:rgba(248,113,113,0.35);}
.feedback-title{
  font-weight:800;
  font-size:14.5px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.feedback.correct .feedback-title{color:var(--ok);}
.feedback.incorrect .feedback-title{color:var(--bad);}
.feedback-block{margin-bottom:12px;}
.feedback-block:last-child{margin-bottom:0;}
.feedback-label{
  font-size:11px;
  font-weight:800;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:5px;
}
.feedback-text{
  font-size:13.5px;
  line-height:1.6;
  color:var(--text);
}
.alt-exp{
  font-size:13px;
  line-height:1.55;
  color:var(--text-dim);
  padding:8px 0;
  border-top:1px solid var(--border);
}
.alt-exp:first-child{border-top:none;padding-top:0;}
.alt-exp b{color:var(--text);}

/* NAV BAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 18px;
}
.navbar-left, .navbar-right{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* RESULTS SCREEN */
.results{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:30px 26px;
}
.results h1{
  font-size:20px;
  text-align:center;
  margin:0 0 22px;
}
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
  margin-bottom:26px;
}
.result-stat{
  background:var(--bg-panel-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  text-align:center;
}
.result-stat .num{font-size:24px;font-weight:800;}
.result-stat .lbl{font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:0.3px;}
.result-stat.ok .num{color:var(--ok);}
.result-stat.bad .num{color:var(--bad);}
.result-stat.warn .num{color:var(--warn);}
.result-stat.acc .num{color:var(--accent);}
.theme-breakdown{
  margin-top:10px;
}
.theme-breakdown h2{
  font-size:14px;
  color:var(--text-dim);
  margin:0 0 12px;
  letter-spacing:0.3px;
}
.theme-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.theme-row:last-child{border-bottom:none;}
.theme-name{flex:1 1 auto;color:var(--text);min-width:140px;}
.theme-bar-track{
  flex:1 1 120px;
  height:7px;
  background:var(--bg-panel-2);
  border-radius:5px;
  overflow:hidden;
  min-width:80px;
}
.theme-bar-fill{height:100%;background:var(--accent);}
.theme-count{
  flex:0 0 auto;
  font-size:12px;
  color:var(--text-dim);
  min-width:52px;
  text-align:right;
}
.results-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:26px;
  flex-wrap:wrap;
}
.footnote{
  text-align:center;
  color:var(--text-faint);
  font-size:11.5px;
  margin-top:18px;
}
.hidden{display:none !important;}
::selection{background:var(--accent-glow);}

/* CUSTOM CONFIRM MODAL (replaces native confirm() which can be blocked in some environments) */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(4,7,12,0.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
  animation:fadeIn .15s ease;
}
.modal-box{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px 24px 20px;
  max-width:420px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-title{
  font-size:15.5px;
  font-weight:700;
  margin-bottom:10px;
  color:var(--text);
}
.modal-msg{
  font-size:13.5px;
  color:var(--text-dim);
  line-height:1.6;
  margin-bottom:20px;
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

@media (max-width:600px){
  .card{padding:18px 16px;}
  .header{padding:12px 14px;flex-wrap:wrap;gap:10px;}
  .navbar{padding:12px 14px;}
  .navbar-left,.navbar-right{flex:1 1 100%;justify-content:center;}
  .pergunta{font-size:15px;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <div class="title"><span class="dot">●</span> Simulado MFC</div>
      <div class="subtitle">Medicina de Família e Comunidade · 70 questões</div>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </div>

  <div id="screenIntro"></div>
  <div id="screenQuiz" class="hidden"></div>
  <div id="screenResults" class="hidden"></div>

</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   BANCO DE QUESTÕES — 70 questões de MFC
   ========================================================= */
const QUESTIONS = [
{
  tema:"Ferramentas de Abordagem Familiar",
  caso:"João Pedro, 7 anos, é levado à consulta pela mãe, Regina, auxiliar de limpeza, preocupada com a queda no rendimento escolar do filho nas últimas semanas. Durante a anamnese ampliada, o médico de família decide construir o genograma da família para compreender melhor o contexto doméstico. Ele registra os pais, Regina e Toninho, unidos por uma linha reta contínua, indicando relação estável entre o casal. Ao representar o vínculo entre João Pedro e seu irmão mais velho, Lucas, de 15 anos, que frequentemente brigam por qualquer motivo dentro de casa, o médico utiliza uma linha em ziguezague entre os dois símbolos.",
  pergunta:"O traçado utilizado entre os irmãos indica:",
  opcoes:[
    {texto:"Relação de proximidade e apoio mútuo entre os irmãos", correta:false, exp:"A linha em ziguezague não representa proximidade; vínculos de apoio próximo costumam ser representados por linhas paralelas múltiplas, não por traçado conflituoso."},
    {texto:"Relação de conflito entre os irmãos", correta:true, exp:"A linha em ziguezague é o símbolo utilizado no genograma para representar relações marcadas por conflito entre membros da família."},
    {texto:"Rompimento total de contato (corte de relação) entre os irmãos", correta:false, exp:"Corte de relação costuma ser indicado por traçado tracejado ou por barras cruzando a linha de vínculo, e não pelo ziguezague, que indica conflito ativo, não ausência de contato."},
    {texto:"Vínculo indiferenciado, sem informação suficiente para qualquer interpretação", correta:false, exp:"O genograma é construído justamente para tornar visíveis os padrões relacionais; um traçado específico (ziguezague) já expressa informação clara sobre o tipo de relação, não ausência de dados."}
  ],
  raciocinio:"O genograma utiliza traçados padronizados para representar diferentes tipos de vínculo entre os membros de uma família. Reconhecer o significado de cada traçado (conflito, distanciamento, corte de relação) permite identificar rapidamente os padrões relacionais durante a consulta e orientar o plano de cuidado."
},
{
  tema:"Ferramentas de Abordagem Familiar",
  caso:"Marcelo, 45 anos, motorista de aplicativo, retorna à UBS para acompanhamento da hipertensão arterial, diagnosticada há dois anos, e relata ter se separado da esposa há seis meses após um período de desentendimentos frequentes. Durante a consulta, ele comenta que mantém contato distante, mas ainda cordial, com o pai, que mora na mesma cidade mas raramente o visita. Ao atualizar o genograma da família no prontuário, a médica de família desenha dois quadrados (Marcelo e seu pai) unidos por uma linha tracejada, representando esse afastamento sem ruptura completa. Já a relação entre Marcelo e a ex-esposa, representada por um círculo, é registrada por meio de duas linhas paralelas cruzadas por duas barras, uma vez que o divórcio já foi oficializado em cartório.",
  pergunta:"A representação da relação entre Marcelo e a ex-esposa, com duas linhas cruzadas por barras, indica:",
  opcoes:[
    {texto:"Casamento estável em curso", correta:false, exp:"Um casamento estável seria representado por uma linha contínua simples entre os símbolos, sem barras de interrupção."},
    {texto:"Separação/divórcio formalizado", correta:true, exp:"Barras cruzando a linha de união entre os símbolos representam separação ou divórcio formal, distinguindo-se do simples distanciamento emocional."},
    {texto:"Distanciamento emocional sem separação formal, como o traçado usado entre Marcelo e o pai", correta:false, exp:"Distanciamento emocional sem ruptura formal é representado por linha tracejada — exatamente o traçado usado entre Marcelo e o pai no caso, e não pelas barras de corte."},
    {texto:"Conflito ativo e frequente entre o ex-casal", correta:false, exp:"Conflito ativo é tipicamente representado por linha em ziguezague, e não por barras cruzando a linha de união, que indicam ruptura formal do vínculo conjugal."}
  ],
  raciocinio:"Cada símbolo do genograma carrega um significado específico e distinto: linha tracejada indica distanciamento emocional sem ruptura formal; barras cruzando a linha de união indicam separação/divórcio; ziguezague indica conflito. Diferenciar esses traçados é essencial para a leitura correta da dinâmica familiar."
},
{
  tema:"Ferramentas de Abordagem Familiar",
  caso:"Durante uma atividade de educação médica continuada, um estudante de medicina revisa o prontuário de uma família de três gerações acompanhada há anos pela equipe de saúde da família: os avós, hipertensos e já aposentados; o casal de pais, ambos trabalhadores rurais; e os três netos, ainda em idade escolar. Ao observar o genograma anexado ao prontuário, ele nota que os avós aparecem representados na linha horizontal superior do desenho, os pais na linha intermediária e os netos na linha inferior, todos conectados por linhas verticais que indicam filiação entre as gerações.",
  pergunta:"Essa estrutura em três linhas horizontais sobrepostas representa corretamente:",
  opcoes:[
    {texto:"A hierarquia de autoridade familiar, do membro mais poderoso ao menos poderoso", correta:false, exp:"O genograma não representa hierarquia de poder ou autoridade dentro da família; a disposição em linhas reflete gerações, não relações de mando."},
    {texto:"As gerações da família, organizadas da mais antiga para a mais recente", correta:true, exp:"O genograma organiza os membros por gerações, geralmente com a geração mais antiga na linha superior, permitindo visualizar a estrutura familiar ao longo do tempo."},
    {texto:"O grau de proximidade afetiva entre os membros da família", correta:false, exp:"Proximidade ou distanciamento afetivo é representado pelos traçados de linha entre os símbolos (contínua, tracejada, ziguezague), e não pela disposição em linhas geracionais."},
    {texto:"A ordem cronológica das consultas realizadas na unidade de saúde", correta:false, exp:"O genograma não registra o histórico de consultas; ele representa a composição e as relações da estrutura familiar ao longo das gerações."}
  ],
  raciocinio:"O genograma organiza os membros da família por gerações (avós, pais, filhos), permitindo visualizar rapidamente a estrutura familiar ao longo do tempo, o que auxilia na compreensão do contexto de cuidado da pessoa atendida."
},
{
  tema:"PNAB e Organização da Atenção Básica",
  caso:"Em uma reunião de planejamento estratégico, o gestor municipal de saúde reúne a equipe da UBS Jardim das Flores para discutir a reformulação do fluxo de atendimento da unidade, que vem recebendo críticas da população por conta de longas filas e encaminhamentos considerados excessivos para o pronto-socorro. Durante a discussão, surge a dúvida sobre qual deveria ser, de fato, o papel dessa unidade dentro da organização do sistema de saúde municipal, já que alguns membros da equipe defendem que a UBS deveria funcionar apenas como um posto de triagem inicial, encaminhando a maior parte dos casos para outros serviços.",
  pergunta:"De acordo com a Política Nacional de Atenção Básica, a atenção primária deve funcionar, na organização do sistema de saúde, como:",
  opcoes:[
    {texto:"Um serviço de encaminhamento cujo papel principal é direcionar todos os casos para especialistas", correta:false, exp:"A APS não é apenas um filtro de encaminhamento; ela resolve a maior parte das demandas de saúde e coordena o cuidado quando o encaminhamento é de fato necessário."},
    {texto:"A porta de entrada preferencial do sistema, responsável por acolher novas necessidades e coordenar o cuidado", correta:true, exp:"Conforme a PNAB, a atenção básica é atenção de primeiro contato, contínua e coordenada, funcionando como entrada preferencial ao sistema de saúde."},
    {texto:"Um serviço destinado exclusivamente a casos de baixa complexidade que não geram necessidade de acompanhamento contínuo", correta:false, exp:"A atenção básica também acompanha condições crônicas e complexas ao longo do tempo (longitudinalidade), não se limitando a casos simples e pontuais."},
    {texto:"Um nível assistencial paralelo, que atua de forma independente dos demais pontos da rede", correta:false, exp:"A atenção básica deve estar integrada e articulada com os demais níveis de atenção, coordenando o cuidado, e não atuando de forma isolada."}
  ],
  raciocinio:"A PNAB define a atenção básica pelo conjunto de atributos de primeiro contato, longitudinalidade, integralidade e coordenação, o que a torna a organizadora do cuidado dentro da rede de atenção à saúde."
},
{
  tema:"PNAB e Organização da Atenção Básica",
  caso:"A equipe de saúde da família da UBS Vila Esperança percebe, ao analisar as fichas de atendimento dos últimos seis meses, que grande parte dos usuários cadastrados no território trabalha em regime CLT, das 8h às 18h, em uma fábrica têxtil próxima, e por isso não consegue comparecer às consultas agendadas no horário habitual de funcionamento da unidade (8h às 17h, de segunda a sexta-feira). Como consequência, muitas dessas famílias acabam perdendo o acompanhamento longitudinal de condições crônicas, como hipertensão e diabetes, e recorrem esporadicamente ao pronto-atendimento municipal.",
  pergunta:"Para garantir o acesso e a continuidade do cuidado a essa parcela da população, a estratégia mais alinhada aos princípios da organização da atenção básica seria:",
  opcoes:[
    {texto:"Orientar que esses usuários utilizem exclusivamente serviços de urgência quando necessário", correta:false, exp:"Substituir o acompanhamento longitudinal na APS por atendimentos pontuais de urgência fragmenta o cuidado e não resolve o problema de acesso identificado."},
    {texto:"Ampliar ou adequar o horário de funcionamento da unidade às necessidades da população do território", correta:true, exp:"A organização do processo de trabalho deve considerar as necessidades locais da população coberta, incluindo horários que ampliem o acesso e garantam a longitudinalidade do cuidado."},
    {texto:"Restringir o cadastro dessas famílias na equipe, já que não podem comparecer com frequência", correta:false, exp:"Excluir famílias do cadastro por dificuldade de horário contraria o princípio de responsabilização por uma população adstrita e amplia a desigualdade de acesso."},
    {texto:"Transferir a responsabilidade pelo cuidado dessas famílias para o pronto-socorro municipal", correta:false, exp:"Transferir o cuidado continuado para serviços de urgência rompe com a longitudinalidade e a coordenação, funções centrais da atenção básica."}
  ],
  raciocinio:"A organização do processo de trabalho da equipe deve considerar as necessidades locais e a realidade da população coberta, o que pode incluir a adequação de horários para ampliar o acesso e preservar a longitudinalidade do cuidado."
},
{
  tema:"PNAB e Organização da Atenção Básica",
  caso:"Uma equipe de Saúde da Família recém-formada está prestes a assumir a cobertura de um novo bairro na periferia da cidade, ainda sem cadastro territorial consolidado. Antes de iniciar as visitas domiciliares, a enfermeira da equipe sugere reunir a equipe para definir os limites da área de abrangência, considerando que parte do bairro cresceu de forma desordenada nos últimos anos, com ocupações irregulares e aumento populacional não registrado nos dados oficiais mais recentes.",
  pergunta:"Segundo os princípios da organização da atenção básica, a definição do território de atuação da equipe deve se basear em:",
  opcoes:[
    {texto:"Apenas limites administrativos fixos definidos há décadas, sem necessidade de atualização", correta:false, exp:"O território deve ser entendido como dinâmico, exigindo revisão contínua, e não permanecer fixo indefinidamente com base em limites administrativos antigos."},
    {texto:"Dados epidemiológicos atuais, cadastro territorial e capacidade operacional da equipe, com revisão contínua", correta:true, exp:"A territorialização exige diagnóstico local combinando dados objetivos, escuta comunitária e observação do território, com revisão periódica conforme a realidade muda."},
    {texto:"Exclusivamente a distância física entre a unidade de saúde e as residências", correta:false, exp:"A distância física é apenas um dos elementos possíveis; a definição do território deve considerar também dados epidemiológicos, vulnerabilidade e capacidade operacional da equipe."},
    {texto:"A preferência dos usuários sobre qual equipe desejam ser atendidos, independentemente do endereço", correta:false, exp:"A organização por território pressupõe responsabilidade sanitária por uma população adstrita a uma área definida, e não escolha livre e individual da equipe pelo usuário."}
  ],
  raciocinio:"A territorialização exige diagnóstico local combinando dados objetivos, escuta comunitária e observação do território, revisando periodicamente os limites conforme a realidade populacional e operacional muda."
},
{
  tema:"PNAB e Organização da Atenção Básica",
  caso:"Durante o planejamento anual da UBS Central, a equipe realiza uma vistoria na estrutura física da unidade e constata que a rampa de acesso está com o piso danificado, dificultando a entrada de cadeirantes e idosos com dificuldade de locomoção, além de identificar que o fluxo de atendimento na recepção costuma gerar confusão entre os usuários sobre onde aguardar cada tipo de atendimento.",
  pergunta:"Segundo os princípios de organização da atenção básica, a resposta adequada da equipe é:",
  opcoes:[
    {texto:"Ignorar a questão, pois estrutura física não é responsabilidade da equipe de saúde", correta:false, exp:"A adequação da infraestrutura e dos fluxos ao território e à população faz parte da organização do processo de trabalho da atenção básica, não podendo ser simplesmente ignorada."},
    {texto:"Adequar a infraestrutura, a ambiência e os fluxos de atendimento às necessidades da população e do território", correta:true, exp:"A organização da atenção básica prevê que a infraestrutura, a ambiência e os fluxos sejam adequados à população e ao território, garantindo acesso real e não apenas teórico."},
    {texto:"Orientar que pessoas com dificuldade de locomoção sejam atendidas em outra unidade mais distante, mas já adaptada", correta:false, exp:"Deslocar o problema para outra unidade distante cria nova barreira de acesso, contrariando o princípio de que a própria unidade deve se adequar às necessidades de sua população adstrita."},
    {texto:"Aguardar reforma geral do prédio antes de tomar qualquer providência", correta:false, exp:"A equipe pode e deve buscar adequações possíveis nos fluxos e na ambiência mesmo antes de uma reforma estrutural completa, evitando que barreiras de acesso persistam sem resposta."}
  ],
  raciocinio:"A organização da atenção básica prevê que a infraestrutura, a ambiência e os fluxos de atendimento sejam adequados à população e ao território, garantindo acesso real e equânime a todos os usuários."
},
{
  tema:"Populações Vulneráveis",
  caso:"O território coberto pela equipe de Saúde da Família do bairro Nova Aurora é caracterizado por ocupações irregulares, ausência de saneamento básico em parte das ruas, alta rotatividade populacional e histórico de violência armada frequente. Nos últimos meses, a equipe percebeu aumento expressivo de casos de escabiose, diarreia infecciosa em crianças e agravamento de quadros de asma, associados às condições precárias de moradia.",
  pergunta:"Diante desse cenário, a decisão mais adequada da equipe de APS é:",
  opcoes:[
    {texto:"Aplicar exatamente o mesmo protocolo de atendimento utilizado em territórios de baixa vulnerabilidade, sem qualquer adaptação", correta:false, exp:"Tratar territórios de vulnerabilidade muito diferente da mesma forma ignora o princípio da equidade, que exige respostas diferenciadas para reduzir desigualdades injustas."},
    {texto:"Intensificar a identificação de vulnerabilidades, priorizando ações e acompanhamento mais próximo às famílias de maior risco", correta:true, exp:"Diante de alta vulnerabilidade, a equipe deve intensificar a identificação de riscos e direcionar mais recursos e acompanhamento a quem mais precisa, seguindo o princípio da equidade."},
    {texto:"Encaminhar automaticamente todas as famílias do território para acompanhamento exclusivamente hospitalar", correta:false, exp:"Encaminhar toda a população para o nível hospitalar contraria o papel coordenador e resolutivo da atenção primária, que deve responder à maior parte das necessidades no próprio território."},
    {texto:"Reduzir a frequência de visitas domiciliares até que a situação social do território melhore espontaneamente", correta:false, exp:"Reduzir o acompanhamento em um território de alta vulnerabilidade tende a agravar os riscos, indo na direção oposta à resposta proporcional que a equidade exige."}
  ],
  raciocinio:"Diante de alta vulnerabilidade, a equipe deve intensificar a identificação de riscos e direcionar mais recursos e acompanhamento a quem mais precisa, seguindo o princípio da equidade em saúde."
},
{
  tema:"Populações Vulneráveis",
  caso:"Durante uma visita domiciliar de rotina, a técnica de enfermagem percebe que Ana Clara, de 2 anos, faltou às últimas três consultas de puericultura agendadas na UBS. Ao conversar com a mãe, Débora, de 24 anos, desempregada há quatro meses, ela relata dificuldade financeira para comprar alimentos suficientes para a família, composta também por outros dois filhos pequenos, e menciona que muitas vezes prioriza levar as crianças mais novas ao mercado informal de trocas de alimentos do bairro em vez de comparecer às consultas agendadas.",
  pergunta:"A conduta mais adequada da equipe, considerando o conceito de vulnerabilidade na APS, é:",
  opcoes:[
    {texto:"Aguardar que a família retorne espontaneamente à unidade, já que a falta é responsabilidade exclusiva dos pais", correta:false, exp:"Adotar postura passiva diante de faltas repetidas em contexto de vulnerabilidade contraria o papel ativo da equipe na identificação e resposta a riscos no território."},
    {texto:"Realizar busca ativa, avaliar a insegurança alimentar e articular apoio com a rede intersetorial disponível", correta:true, exp:"Vulnerabilidade exige resposta ativa da equipe: busca ativa da criança faltosa, avaliação da insegurança alimentar e articulação intersetorial, sem punir a família nem fragmentar o cuidado."},
    {texto:"Notificar a família ao Conselho Tutelar imediatamente, sem qualquer avaliação prévia da situação", correta:false, exp:"Notificação sem avaliação prévia é uma medida desproporcional; a conduta inicial deve ser de busca ativa, escuta e articulação de suporte, reservando notificações a situações que exijam proteção legal específica."},
    {texto:"Transferir o caso para atendimento hospitalar especializado, encerrando o acompanhamento pela UBS", correta:false, exp:"Encerrar o acompanhamento na atenção básica fragmenta o cuidado longitudinal, que é justamente o que a criança em situação de vulnerabilidade mais necessita."}
  ],
  raciocinio:"Vulnerabilidade não é sinônimo de pobreza isolada, mas exige resposta ativa da equipe: busca ativa, avaliação da situação e articulação intersetorial, sem punir a família nem fragmentar o cuidado longitudinal."
},
{
  tema:"Populações Vulneráveis",
  caso:"A comunidade rural de Serra Verde fica a 40 km da unidade de saúde mais próxima, acessível apenas por estrada de terra que fica intransitável em dias de chuva. A maioria das famílias vive da agricultura de subsistência, com baixa escolaridade e limitado acesso a transporte próprio ou coletivo, dependendo do carro de um vizinho ou de caronas esporádicas para chegar à cidade.",
  pergunta:"Sob a ótica da equidade em saúde, a equipe da APS deve:",
  opcoes:[
    {texto:"Oferecer exatamente os mesmos recursos e frequência de atendimento disponibilizados às famílias urbanas próximas à unidade", correta:false, exp:"Oferecer o mesmo padrão de atendimento a populações com necessidades e barreiras de acesso muito diferentes contraria o princípio da equidade, que exige respostas proporcionais à necessidade."},
    {texto:"Reconhecer a maior dificuldade de acesso dessa população e organizar estratégias diferenciadas, como visitas programadas mais frequentes", correta:true, exp:"A equidade exige tratar desigualmente os desiguais, oferecendo mais suporte a quem enfrenta mais barreiras de acesso, como estratégias diferenciadas de visita e acompanhamento."},
    {texto:"Orientar que essas famílias resolvam o problema de transporte por conta própria, sem qualquer adaptação do serviço", correta:false, exp:"Deixar a resolução do problema de acesso inteiramente a cargo da família, sem qualquer adaptação da equipe, contraria o papel da atenção primária de reduzir barreiras de acesso."},
    {texto:"Excluir essas famílias do cadastro da equipe, já que estão fora do alcance geográfico habitual", correta:false, exp:"Excluir uma população do cadastro por dificuldade de acesso amplia a desigualdade, contrariando diretamente o princípio da equidade e da universalidade do cuidado."}
  ],
  raciocinio:"A equidade exige tratar desigualmente os desiguais, oferecendo mais suporte e estratégias diferenciadas a quem enfrenta mais barreiras de acesso, sem reduzir a responsabilidade da equipe sobre essa população."
},
{
  tema:"Saúde Mental - Depressão",
  caso:"Marina, 29 anos, professora de educação infantil, retorna à UBS para consulta de seguimento três meses após o início de sertralina 50mg/dia, prescrita para episódio depressivo moderado desencadeado após a perda do emprego anterior. Ela relata que o humor melhorou em relação ao início do tratamento, consegue voltar a interagir com os colegas de trabalho no novo emprego, mas ainda apresenta anedonia leve em relação a atividades que antes lhe davam prazer, como pintura, além de despertar precoce ocasional durante a madrugada.",
  pergunta:"Considerando as fases do tratamento da depressão, a conduta mais adequada neste momento é:",
  opcoes:[
    {texto:"Suspender o antidepressivo imediatamente, pois a resposta parcial indica falha terapêutica", correta:false, exp:"Interromper precocemente pode levar a recaída; a fase aguda do tratamento dura tipicamente de 2 a 6 meses, e melhora parcial nesse período não indica falha terapêutica."},
    {texto:"Manter o tratamento, pois a paciente ainda está na fase aguda/de consolidação da resposta, reavaliando a evolução", correta:true, exp:"A fase aguda do tratamento (2 a 6 meses) busca reduzir os sintomas; melhora parcial com poucos meses de uso é esperada e justifica manutenção com reavaliação periódica."},
    {texto:"Trocar imediatamente para um antidepressivo tricíclico, já na primeira reavaliação", correta:false, exp:"Tricíclicos são alternativa reservada para quando ISRS/ISRSN não funcionam após tempo adequado de uso, dado seu maior perfil de efeitos adversos, e não a primeira opção diante de melhora parcial."},
    {texto:"Encaminhar compulsoriamente para internação psiquiátrica, dada a persistência de sintomas", correta:false, exp:"Não há critério de gravidade ou de risco descrito no caso que justifique internação; o quadro de melhora parcial é compatível com seguimento ambulatorial na atenção primária."}
  ],
  raciocinio:"Reconhecer as fases do tratamento da depressão (aguda, manutenção, continuação) evita decisões precipitadas de suspensão ou troca do antidepressivo diante de melhora apenas parcial nos primeiros meses."
},
{
  tema:"Saúde Mental - Depressão",
  caso:"Durante consulta de retorno, Ricardo, 34 anos, acompanhado há dois meses por quadro depressivo moderado, chega visivelmente mais contido do que de costume e, ao ser questionado ativamente pelo médico sobre pensamentos de morte, relata que nas últimas duas semanas passou a pensar recorrentemente em suicídio, já elaborou um plano específico envolvendo medicamentos guardados em casa e confirma ter acesso fácil a essas substâncias no momento.",
  pergunta:"A conduta imediata mais adequada é:",
  opcoes:[
    {texto:"Agendar retorno em 30 dias para reavaliação do quadro, mantendo a mesma medicação", correta:false, exp:"Diante de ideação com plano estruturado e acesso a meios, adiar a reavaliação por 30 dias expõe o paciente a risco iminente que exige ação imediata, não seguimento de rotina."},
    {texto:"Encaminhar com urgência para avaliação em serviço de urgência/emergência, dado o alto risco de suicídio", correta:true, exp:"A presença de ideação, plano estruturado e acesso a meios caracteriza alto risco de suicídio, exigindo encaminhamento urgente para avaliação em serviço de urgência."},
    {texto:"Aumentar a dose do antidepressivo e orientar retorno em 15 dias, sem outras medidas", correta:false, exp:"Apenas ajustar a dose e aguardar 15 dias não responde à urgência do risco descrito; o quadro exige avaliação presencial imediata e ambiente seguro, não apenas ajuste farmacológico."},
    {texto:"Orientar apenas técnicas de respiração e observação domiciliar pela família, sem qualquer encaminhamento", correta:false, exp:"Diante de risco iminente com plano e meios disponíveis, orientações domiciliares isoladas são insuficientes; é necessária avaliação urgente em ambiente adequado."}
  ],
  raciocinio:"A presença de ideação suicida, plano estruturado e acesso a meios caracteriza alto risco de suicídio, exigindo encaminhamento urgente, conforme os critérios de gravidade que orientam o referenciamento em saúde mental."
},
{
  tema:"Saúde Mental - Depressão",
  caso:"Em consulta de rotina, o médico de família aplica o instrumento de rastreio e avaliação de gravidade de sintomas depressivos em Juliana, 41 anos, cozinheira, que já vinha em acompanhamento havia três semanas por queixas de tristeza persistente e insônia. Ao somar as respostas do questionário estruturado, o escore final obtido é de 17 pontos.",
  pergunta:"Ao utilizar o PHQ-9 e obter uma pontuação de 17 pontos, o resultado sugere:",
  opcoes:[
    {texto:"Ausência de sintomas depressivos significativos", correta:false, exp:"Pontuações abaixo de 4 pontos é que sugerem interromper a investigação por ausência de sintomas relevantes; 17 pontos está muito acima desse patamar."},
    {texto:"Sintomas subsindrômicos, sem necessidade de investigação adicional", correta:false, exp:"Sintomas subsindrômicos correspondem à faixa de 5 a 8 pontos no PHQ-9; 17 pontos ultrapassa amplamente essa faixa, indicando quadro mais grave."},
    {texto:"Episódio depressivo moderado a grave, indicando necessidade de conduta terapêutica ativa", correta:true, exp:"Pontuações do PHQ-9 acima de 15 pontos sugerem episódio depressivo moderado/grave, indicando necessidade de tratamento ativo e acompanhamento próximo."},
    {texto:"Episódio depressivo leve, que deve ser apenas observado sem intervenção", correta:false, exp:"Episódio depressivo leve corresponde à faixa de 9 a 14 pontos no PHQ-9; 17 pontos está acima dessa faixa, sugerindo quadro moderado a grave, e mesmo o quadro leve não deveria ser apenas observado sem qualquer conduta."}
  ],
  raciocinio:"O PHQ-9 é um instrumento desenhado para a atenção primária que sugere diferentes níveis de gravidade conforme a pontuação obtida; pontuações acima de 15 indicam episódio depressivo moderado a grave, exigindo conduta terapêutica ativa."
},
{
  tema:"Saúde Mental - Depressão",
  caso:"Fábio, 26 anos, técnico em informática, está em tratamento para episódio depressivo há três semanas com fluoxetina, iniciada após avaliação inicial na UBS. Na consulta de retorno, a esposa relata, preocupada, que ele passou a dormir muito pouco nas últimas noites, aparentemente sem cansaço, fala de forma acelerada sobre planos grandiosos para abrir uma empresa e, ao ser questionado, o próprio Fábio conta que já teve, em outras ocasiões da vida, períodos parecidos de euforia intensa e pouca necessidade de sono, que duraram algumas semanas.",
  pergunta:"Esses achados levantam suspeita de qual condição, que deve ser investigada antes de simplesmente ajustar a dose do antidepressivo?",
  opcoes:[
    {texto:"Transtorno de ansiedade generalizada isolado", correta:false, exp:"O relato de períodos de humor muito elevado e menor necessidade de sono não é característico da ansiedade generalizada, que se apresenta como preocupação excessiva contínua, sem esses episódios de humor elevado."},
    {texto:"Transtorno do humor bipolar, o que pode exigir abordagem diferenciada e encaminhamento", correta:true, exp:"A avaliação da depressão deve sempre buscar história de mania/hipomania; resposta anormal a antidepressivos e histórico de humor elevado sugerem transtorno bipolar, mudando a conduta terapêutica."},
    {texto:"Transtorno obsessivo-compulsivo", correta:false, exp:"Não há relato de rituais ou pensamentos obsessivos no caso; os achados descritos (humor elevado, menor necessidade de sono, resposta atípica ao antidepressivo) apontam para investigação de mania/hipomania, não para TOC."},
    {texto:"Efeito esperado e normal de qualquer antidepressivo, sem necessidade de investigação", correta:false, exp:"Resposta anormal ao antidepressivo associada a história sugestiva de mania/hipomania é sinal de alerta que deve ser investigado, e não considerado efeito trivial e esperado do tratamento."}
  ],
  raciocinio:"Na avaliação clínica da depressão, é fundamental buscar história de mania/hipomania, pois resposta anormal a antidepressivos e histórico de humor elevado sugerem transtorno bipolar, o que muda significativamente a conduta terapêutica e pode indicar necessidade de encaminhamento."
},
{
  tema:"Saúde Mental - Depressão",
  caso:"Seu Antônio, 78 anos, viúvo há três meses após o falecimento da esposa com quem viveu por 52 anos, é levado à UBS pela filha, que mora na mesma rua e passou a notá-lo mais isolado, com queixas de tristeza, desânimo e esquecimentos leves no dia a dia, como esquecer de tomar a medicação para hipertensão em alguns dias.",
  pergunta:"Na avaliação desse paciente, além do rastreio para depressão, a equipe deve:",
  opcoes:[
    {texto:"Assumir que se trata apenas de luto normal, dispensando qualquer investigação adicional", correta:false, exp:"A presença de queixas cognitivas associadas a sintomas depressivos em idoso não deve ser descartada sem avaliação; é necessário investigar possível comorbidade, e não presumir automaticamente luto normal sem avaliação."},
    {texto:"Considerar o uso de escala de rastreio cognitivo, dado o risco de comorbidade entre sintomas depressivos e declínio cognitivo em idosos", correta:true, exp:"Na avaliação de depressão em idosos, deve-se considerar rastreio cognitivo (como a escala de 10 pontos), pois sintomas depressivos podem coexistir ou mascarar quadros demenciais."},
    {texto:"Iniciar antipsicótico de imediato, independentemente da gravidade dos sintomas", correta:false, exp:"Antipsicóticos são reservados a situações específicas, como sintomas psicóticos associados ou casos refratários; não há indicação para uso imediato e indiscriminado nesse cenário inicial."},
    {texto:"Encaminhar compulsoriamente para internação psiquiátrica pela idade avançada", correta:false, exp:"A idade avançada, isoladamente, não é critério de internação; o quadro descrito é compatível com avaliação e manejo inicial na atenção primária, com atenção à possível comorbidade cognitiva."}
  ],
  raciocinio:"Na avaliação de depressão em idosos, deve-se considerar o uso de escala de rastreio cognitivo, pois sintomas depressivos podem coexistir ou mascarar declínio cognitivo, o que orienta a conduta e o acompanhamento adequados."
},
{
  tema:"Estrutura da Equipe (ESF)",
  caso:"O secretário municipal de saúde de um município de médio porte está planejando a implantação de quatro novas equipes de Estratégia Saúde da Família em bairros que ainda não possuem cobertura de atenção básica, entre eles um bairro predominantemente residencial de classe média e outro de ocupação recente, com alta densidade populacional e forte presença de famílias em situação de vulnerabilidade social.",
  pergunta:"De acordo com os princípios de organização da atenção básica, a composição e a carga horária das equipes devem ser definidas principalmente considerando:",
  opcoes:[
    {texto:"Um número fixo e universal de profissionais, idêntico para qualquer território, independentemente das características locais", correta:false, exp:"Um modelo rígido e uniforme ignora as diferenças de necessidade entre territórios, contrariando o princípio de que a organização deve considerar a realidade local."},
    {texto:"As atribuições dos profissionais, a cobertura populacional e as necessidades específicas do território", correta:true, exp:"A organização do processo de trabalho das equipes deve considerar atribuições dos profissionais, cobertura e necessidades locais, evitando modelos rígidos que ignorem a realidade do território."},
    {texto:"Exclusivamente a disponibilidade orçamentária do município, sem considerar o perfil da população", correta:false, exp:"Embora o financiamento seja relevante para a viabilidade, a organização da equipe deve partir das necessidades da população e do território, e não apenas de critérios orçamentários isolados."},
    {texto:"A preferência pessoal dos profissionais quanto à carga horária de trabalho", correta:false, exp:"A carga horária das equipes deve ser compatível com as atribuições e a cobertura necessária ao território, e não definida apenas pela preferência individual dos profissionais."}
  ],
  raciocinio:"A organização do processo de trabalho das equipes de saúde da família deve considerar atribuições dos profissionais, cobertura populacional e necessidades específicas do território, evitando modelos rígidos e uniformes que ignorem a realidade local."
},
{
  tema:"Estrutura da Equipe (ESF)",
  caso:"A equipe de Saúde da Família da UBS Boa Vista, composta por um médico, uma enfermeira, dois técnicos de enfermagem e quatro agentes comunitários, é responsável por um território com mais de 5 mil pessoas cadastradas. Nos últimos meses, os profissionais relatam cansaço acumulado, dificuldade de concluir as visitas domiciliares programadas e agenda de consultas lotada com semanas de antecedência.",
  pergunta:"Esse cenário reflete um desafio amplamente reconhecido na prática da Medicina de Família e Comunidade, que é:",
  opcoes:[
    {texto:"A ausência completa de qualquer problema estrutural, sendo a sobrecarga apenas percepção subjetiva dos profissionais", correta:false, exp:"A sobrecarga de trabalho por grande volume de pacientes é um desafio real e reconhecido da prática em MFC, e não apenas percepção subjetiva sem base estrutural."},
    {texto:"A sobrecarga de trabalho decorrente de grande carga de pacientes, um desafio conhecido da profissão", correta:true, exp:"A sobrecarga de trabalho é um desafio amplamente reconhecido da MFC, relacionado ao grande volume de pacientes atendidos pelas equipes, exigindo atenção da gestão para o dimensionamento adequado."},
    {texto:"Um problema exclusivo de equipes urbanas, que nunca ocorre em áreas rurais", correta:false, exp:"A sobrecarga de trabalho e os recursos limitados são desafios que também afetam áreas rurais, não sendo exclusivos do contexto urbano."},
    {texto:"Uma situação que deve ser resolvida apenas reduzindo o número de famílias cadastradas, sem qualquer outra medida de gestão", correta:false, exp:"A resposta a essa sobrecarga envolve múltiplas estratégias de gestão e dimensionamento adequado da equipe, e não apenas a redução do número de famílias cadastradas como única medida."}
  ],
  raciocinio:"A sobrecarga de trabalho, relacionada ao grande volume de pacientes atendidos, é um desafio reconhecido da prática em Medicina de Família e Comunidade, exigindo atenção da gestão para o dimensionamento adequado das equipes."
},
{
  tema:"Estrutura da Equipe (ESF)",
  caso:"Durante uma reunião de equipe, o médico de família comenta que, desde que concluiu a residência há três anos, já precisou revisar diversas vezes os protocolos de manejo de hipertensão, diabetes e saúde mental que utiliza no dia a dia, à medida que novas diretrizes e evidências foram publicadas.",
  pergunta:"Esse desafio da prática em MFC é mais bem descrito como:",
  opcoes:[
    {texto:"Desnecessário, pois protocolos de atenção básica nunca sofrem atualização", correta:false, exp:"A medicina, incluindo a atenção básica, está em constante evolução, com atualização frequente de diretrizes, o que torna essa alternativa incompatível com a realidade da prática."},
    {texto:"A necessidade de atualização constante, já que a medicina está em evolução contínua e o médico de família deve acompanhar novas diretrizes", correta:true, exp:"A prática da MFC exige atualização constante, pois a medicina está em contínua evolução, sendo esse um dos desafios reconhecidos da profissão."},
    {texto:"Um problema exclusivo de especialistas focais, sem qualquer relação com a prática generalista", correta:false, exp:"A necessidade de atualização constante afeta também — e especialmente — o médico de família, dada a amplitude de condições que deve acompanhar ao longo da vida do paciente."},
    {texto:"Resolvido definitivamente após a conclusão da residência médica, sem necessidade de educação continuada", correta:false, exp:"A formação inicial não elimina a necessidade de educação continuada; a atualização constante é um desafio permanente ao longo de toda a carreira do médico de família."}
  ],
  raciocinio:"A prática da MFC exige atualização constante, pois a medicina está em contínua evolução, sendo esse um dos desafios reconhecidos da profissão que impacta diretamente a qualidade do cuidado prestado."
},
{
  tema:"População em Situação de Rua",
  caso:"Pedro, 52 anos, vive em situação de rua há aproximadamente oito anos na região central da cidade, sobrevivendo de trabalhos informais esporádicos. Ele procura espontaneamente a UBS de referência do território, relatando tosse persistente há mais de três semanas, associada a sudorese noturna e emagrecimento perceptível, segundo ele mesmo, de cerca de 6 kg nos últimos dois meses. Chega à recepção sem documento de identificação e sem comprovante de residência.",
  pergunta:"Diante desse quadro, a conduta prioritária da equipe de APS deve incluir:",
  opcoes:[
    {texto:"Recusar o atendimento por ausência de endereço fixo e documentação atualizada", correta:false, exp:"A ausência de endereço fixo ou documentação não pode ser barreira para o acolhimento e atendimento na atenção básica, que deve garantir acesso universal, inclusive a populações em situação de rua."},
    {texto:"Realizar acolhimento e investigar ativamente doenças negligenciadas, como tuberculose, dado o quadro clínico sugestivo", correta:true, exp:"Tosse persistente por mais de três semanas associada a emagrecimento em população vulnerável é sinal de alerta para tuberculose, doença negligenciada com maior prevalência em populações em situação de rua; a equipe deve acolher e investigar."},
    {texto:"Orientar que o paciente procure exclusivamente um hospital de referência em outra cidade", correta:false, exp:"Encaminhar o paciente para fora do território sem qualquer avaliação inicial na própria unidade nega o papel de primeiro contato e acolhimento da atenção básica."},
    {texto:"Aguardar retorno espontâneo em consulta agendada daqui a dois meses, sem investigação imediata", correta:false, exp:"Diante de sintomas sugestivos de doença negligenciada com potencial gravidade, adiar a investigação por dois meses expõe o paciente e a comunidade a riscos evitáveis."}
  ],
  raciocinio:"Tosse persistente associada a emagrecimento em população vulnerável é sinal de alerta para doenças negligenciadas, como a tuberculose; a atenção básica deve acolher sem barreiras administrativas e investigar ativamente esse tipo de apresentação clínica."
},
{
  tema:"População em Situação de Rua",
  caso:"Durante uma abordagem de rotina em via pública, a equipe do Consultório na Rua encontra Marcos, 39 anos, que vive embaixo de um viaduto há cerca de dois anos. Ao realizar exame físico simplificado, a enfermeira identifica, no antebraço direito, uma lesão de pele esbranquiçada, de bordas bem definidas, na qual Marcos relata não sentir nada quando tocada com um cotonete, mesmo diante da observação direta da equipe.",
  pergunta:"Esse achado levanta suspeita de qual doença negligenciada, que deve ser priorizada na avaliação?",
  opcoes:[
    {texto:"Hanseníase", correta:true, exp:"Lesões hipocrômicas com alteração de sensibilidade são achado clássico sugestivo de hanseníase, doença negligenciada com maior prevalência em populações vulneráveis, incluindo pessoas em situação de rua."},
    {texto:"Hipertensão arterial sistêmica", correta:false, exp:"A hipertensão não se manifesta com lesões cutâneas hipocrômicas e alteração de sensibilidade; esse achado semiológico não se relaciona a essa condição."},
    {texto:"Diabetes mellitus tipo 2", correta:false, exp:"O diabetes pode causar alterações de sensibilidade em estágios avançados (neuropatia), mas não se relaciona a lesões cutâneas hipocrômicas como achado característico."},
    {texto:"Transtorno de ansiedade generalizada", correta:false, exp:"Transtornos de ansiedade não se manifestam com achados dermatológicos como lesões hipocrômicas e alteração de sensibilidade."}
  ],
  raciocinio:"O reconhecimento de sinais clínicos característicos de doenças negligenciadas, como a hanseníase (lesões hipocrômicas com alteração de sensibilidade), é essencial no cuidado de populações vulneráveis, incluindo pessoas em situação de rua."
},
{
  tema:"População em Situação de Rua",
  caso:"O gestor municipal de saúde discute com a equipe técnica a criação de um serviço voltado especificamente para atender a população em situação de rua da região central, que hoje soma cerca de 200 pessoas segundo o último censo populacional, muitas das quais não buscam espontaneamente as UBS de referência por medo de discriminação ou por não possuírem documentação.",
  pergunta:"Essa estratégia, prevista na organização da rede de atenção à saúde, corresponde a:",
  opcoes:[
    {texto:"Pronto-socorro móvel exclusivo para emergências clínicas", correta:false, exp:"O serviço descrito não se limita a emergências clínicas; trata-se de uma modalidade da atenção primária voltada à ampliação do acesso dessa população específica."},
    {texto:"Consultório na Rua, integrado à Atenção Primária à Saúde", correta:true, exp:"O Consultório na Rua é uma modalidade da Atenção Primária à Saúde destinada a ampliar o acesso de populações em situação de rua ao cuidado, sendo um dos pontos de atenção primária na rede de saúde."},
    {texto:"Centro de Atenção Psicossocial (CAPS) especializado apenas em dependência química", correta:false, exp:"O CAPS é um ponto especializado de saúde mental, distinto do Consultório na Rua, que é um dispositivo da própria atenção primária voltado a essa população."},
    {texto:"Ambulatório de especialidades vinculado exclusivamente ao nível hospitalar", correta:false, exp:"O dispositivo descrito está vinculado à atenção primária, e não a um ambulatório de especialidades de nível hospitalar."}
  ],
  raciocinio:"O Consultório na Rua é uma modalidade da Atenção Primária à Saúde destinada a ampliar o acesso de populações em situação de rua ao cuidado, sendo citado como um dos pontos de atenção primária dentro da rede de atenção à saúde."
},
{
  tema:"Ética e Saúde do Adolescente",
  caso:"Larissa, 15 anos, estudante do ensino médio, comparece sozinha à UBS após faltar à escola durante o período da manhã, sem o conhecimento dos pais. Ela relata ao médico de família que iniciou relacionamento afetivo há dois meses e deseja iniciar o uso de método contraceptivo, pedindo explicitamente que a informação não seja compartilhada com os pais, pois teme reação de punição por parte deles.",
  pergunta:"A conduta do médico de família, considerando a autonomia progressiva do adolescente, deve ser:",
  opcoes:[
    {texto:"Recusar o atendimento e exigir a presença obrigatória de um responsável legal para qualquer orientação", correta:false, exp:"Exigir presença obrigatória de responsável para orientação sobre sexualidade contraria o reconhecimento da autonomia progressiva do adolescente e pode afastá-lo do cuidado."},
    {texto:"Acolher a adolescente, orientar sobre métodos contraceptivos e manter a confidencialidade, respeitando sua autonomia, salvo risco relevante", correta:true, exp:"O ECA e o CFM reconhecem a capacidade decisória crescente do adolescente; questões de sexualidade e saúde reprodutiva são consideradas confidenciais, e o sigilo só deve ser quebrado diante de risco relevante."},
    {texto:"Informar imediatamente os pais da adolescente, independentemente do desejo dela, por se tratar de menor de idade", correta:false, exp:"A menoridade, isoladamente, não justifica a quebra automática do sigilo sobre temas de saúde sexual e reprodutiva, que são considerados confidenciais na consulta com adolescentes."},
    {texto:"Negar qualquer orientação sobre contracepção até que a adolescente complete 18 anos", correta:false, exp:"Negar orientação e acesso ao planejamento familiar contraria o direito da adolescente à saúde sexual e reprodutiva, reconhecido mesmo antes da maioridade civil."}
  ],
  raciocinio:"O ECA e o CFM reconhecem a capacidade decisória crescente do adolescente; sexualidade e saúde reprodutiva são temas confidenciais na consulta, e o sigilo só deve ser quebrado diante de risco relevante à vida ou à saúde, sempre comunicando o adolescente sobre essa necessidade."
},
{
  tema:"Ética e Saúde do Adolescente",
  caso:"Gabriel, 16 anos, comparece à consulta de rotina acompanhado da mãe, mas, durante o momento reservado para conversa a sós, relata ao médico que iniciou vida sexual há alguns meses com a namorada, também adolescente, e pede que essa informação permaneça apenas entre eles dois, já que teme o julgamento da família, embora negue qualquer situação de risco imediato, como uso de substâncias ou violência.",
  pergunta:"Nessa situação, o sigilo profissional:",
  opcoes:[
    {texto:"Deve ser mantido, pois sexualidade é tema confidencial na consulta com adolescentes, na ausência de risco relevante", correta:true, exp:"Sexualidade, uso de substâncias e saúde mental são exemplos de temas confidenciais na consulta com adolescentes; a quebra de sigilo é reservada a situações de risco de vida ou violência grave."},
    {texto:"Deve ser quebrado obrigatoriamente, pois qualquer atividade sexual de menor de idade deve ser informada aos pais", correta:false, exp:"Não há obrigatoriedade automática de informar os pais sobre a vida sexual do adolescente na ausência de risco relevante; esse tema é considerado confidencial na consulta."},
    {texto:"Só pode ser mantido se o adolescente tiver mais de 18 anos", correta:false, exp:"A confidencialidade sobre temas sensíveis já se aplica durante a adolescência, reconhecendo a autonomia progressiva, e não apenas após os 18 anos."},
    {texto:"Deve ser quebrado apenas se os pais solicitarem formalmente a informação", correta:false, exp:"A solicitação dos pais, isoladamente, não é critério para quebra de sigilo; o que justifica a exceção é a presença de risco relevante à vida ou à integridade do adolescente."}
  ],
  raciocinio:"Sexualidade, uso de substâncias e saúde mental são exemplos de temas confidenciais na consulta com adolescentes; a quebra de sigilo é reservada a situações de risco de vida ou violência grave, e não à simples solicitação de terceiros."
},
{
  tema:"Ética e Saúde do Adolescente",
  caso:"Beatriz, 14 anos, é atendida a sós, conforme rotina da equipe para consultas com adolescentes, e, após alguns minutos de silêncio, revela ao médico que vem sofrendo abuso sexual por parte de um tio que mora na mesma casa, há aproximadamente três meses, pedindo insistentemente que ninguém saiba do que contou, por medo de represálias.",
  pergunta:"Nessa situação, a conduta correta quanto à confidencialidade é:",
  opcoes:[
    {texto:"Manter sigilo absoluto, respeitando integralmente o desejo da adolescente de não revelar a ninguém", correta:false, exp:"Risco de violência grave é justamente uma das situações em que o sigilo deve ser excepcionado, pois a proteção da adolescente prevalece sobre a confidencialidade absoluta."},
    {texto:"Quebrar o sigilo e notificar/articular a rede de proteção, pois há risco relevante que justifica a exceção à confidencialidade, comunicando a adolescente sobre a necessidade", correta:true, exp:"Risco de vida ou violência grave justifica a quebra do sigilo profissional mesmo em consultas confidenciais com adolescentes, sempre comunicando o motivo à própria adolescente; a notificação de violência é, além disso, compulsória."},
    {texto:"Aguardar que a própria adolescente resolva a situação sem qualquer intervenção da equipe", correta:false, exp:"Diante de relato de violência sexual, a inação da equipe expõe a adolescente a risco contínuo e contraria a obrigação legal de notificação e proteção."},
    {texto:"Encaminhar apenas para atendimento psicológico particular, sem qualquer notificação", correta:false, exp:"A notificação de suspeita ou confirmação de violência contra criança/adolescente é obrigação legal do profissional de saúde, não podendo ser substituída apenas por encaminhamento psicológico particular."}
  ],
  raciocinio:"Risco de vida ou violência grave justifica a quebra do sigilo profissional mesmo em consultas confidenciais com adolescentes, sempre comunicando o motivo ao próprio adolescente; a notificação de violência contra criança e adolescente é, além disso, obrigação legal do profissional de saúde."
},
{
  tema:"Ética e Saúde do Adolescente",
  caso:"Enzo, 13 anos, é levado à consulta de rotina pela mãe, que permanece na sala durante todo o atendimento inicial. Em determinado momento, o adolescente, visivelmente incomodado, pede discretamente ao médico um momento a sós para conversar sobre \"uma coisa pessoal\", sem especificar do que se trata.",
  pergunta:"A conduta mais alinhada aos princípios do cuidado ao adolescente na APS é:",
  opcoes:[
    {texto:"Negar o pedido, pois todo atendimento de menores de idade deve ocorrer necessariamente na presença dos responsáveis", correta:false, exp:"Negar espaço de escuta a sós contraria a recomendação de reservar parte da consulta para o adolescente, especialmente para temas sensíveis, respeitando sua autonomia progressiva."},
    {texto:"Reservar parte da consulta para escuta a sós, com abordagem centrada na pessoa e sem julgamento", correta:true, exp:"Parte da consulta com o adolescente deve ser realizada sem a presença dos pais, especialmente para temas sensíveis, fortalecendo o vínculo e respeitando a autonomia progressiva."},
    {texto:"Redirecionar o adolescente para que converse apenas com a mãe sobre o assunto", correta:false, exp:"Redirecionar o adolescente para a mãe sem oferecer espaço de escuta médica contraria o papel da equipe de acolher diretamente o adolescente em temas sensíveis."},
    {texto:"Informar à mãe, antes de ouvir o adolescente, que ele deseja tratar de assuntos de sexualidade", correta:false, exp:"Revelar previamente à mãe o teor do pedido de conversa a sós compromete a confidencialidade e o vínculo de confiança, mesmo antes de qualquer conteúdo ter sido discutido."}
  ],
  raciocinio:"Parte da consulta com o adolescente deve ser realizada sem a presença dos pais, especialmente para temas sensíveis como sexualidade, fortalecendo o vínculo e respeitando a autonomia progressiva reconhecida pelo ECA e pelo CFM."
},
{
  tema:"Resolutividade da APS",
  caso:"Em uma reunião do Conselho Municipal de Saúde, discute-se a proposta orçamentária para o próximo ano, que prevê aumento significativo de recursos destinados à ampliação do número de equipes de Saúde da Família, em detrimento da construção de um novo hospital de média complexidade solicitado por alguns vereadores.",
  pergunta:"Esse investimento se justifica porque a atenção primária, na organização em pirâmide dos níveis de atenção, deve ser capaz de resolver:",
  opcoes:[
    {texto:"Cerca de 20% das demandas de saúde da população, encaminhando o restante para outros níveis", correta:false, exp:"Um percentual tão baixo de resolutividade não corresponde ao papel estruturante atribuído à atenção primária como base da pirâmide assistencial."},
    {texto:"Cerca de 80% das demandas de saúde da população, atuando como base do sistema", correta:true, exp:"A atenção primária é considerada a base da pirâmide assistencial justamente por sua capacidade de resolver cerca de 80% das demandas de saúde da população, o que justifica o investimento prioritário nesse nível."},
    {texto:"Exclusivamente casos de baixíssima complexidade, sem impacto relevante na resolutividade geral do sistema", correta:false, exp:"A atenção primária tem impacto relevante e amplo na resolutividade geral do sistema, não se limitando a casos triviais e sem repercussão no conjunto da rede."},
    {texto:"Nenhuma demanda de forma resolutiva, servindo apenas para triagem", correta:false, exp:"A atenção primária não se limita a triagem; ela resolve a maior parte das necessidades de saúde da população, coordenando o cuidado quando o encaminhamento é necessário."}
  ],
  raciocinio:"A atenção primária é considerada a base da pirâmide assistencial justamente por sua capacidade de resolver cerca de 80% das demandas de saúde da população, o que justifica o investimento prioritário nesse nível do sistema."
},
{
  tema:"Resolutividade da APS",
  caso:"Durante uma audiência pública sobre o orçamento da saúde municipal, um vereador argumenta que seria mais eficiente concentrar os recursos disponíveis na construção de um hospital de alta complexidade, alegando que \"é lá que estão os casos graves que realmente importam\", e propõe reduzir o investimento destinado à expansão das equipes de Saúde da Família.",
  pergunta:"Com base no conceito de resolutividade da APS, a resposta mais adequada a esse argumento é:",
  opcoes:[
    {texto:"Concordar integralmente, pois a atenção primária tem baixo impacto na resolução dos problemas de saúde", correta:false, exp:"Essa afirmação contraria o conceito de que a atenção primária resolve a maior parte das demandas de saúde da população, sendo, portanto, incorreta."},
    {texto:"Argumentar que a atenção primária, por resolver a maior parte das demandas de saúde da população, deve ser a base estruturante do sistema, sendo o investimento nela custo-efetivo", correta:true, exp:"Sistemas de saúde com forte base na atenção primária são mais efetivos, equitativos e de menor custo, o que justifica considerá-la a base estruturante da pirâmide assistencial e alvo prioritário de investimento."},
    {texto:"Argumentar que apenas hospitais deveriam existir, eliminando a necessidade de unidades básicas", correta:false, exp:"Eliminar a atenção primária contraria diretamente o conceito de resolutividade da base da pirâmide e sobrecarregaria desnecessariamente o nível hospitalar com demandas que poderiam ser resolvidas na APS."},
    {texto:"Concordar parcialmente, defendendo que a atenção primária deveria ser extinta em áreas urbanas", correta:false, exp:"Não há justificativa para restringir a atenção primária a áreas rurais; o conceito de resolutividade se aplica a toda a população, independentemente do contexto urbano ou rural."}
  ],
  raciocinio:"Sistemas de saúde com forte base na atenção primária são mais efetivos, equitativos e de menor custo, o que justifica considerá-la a base estruturante do sistema e prioridade de investimento, mesmo diante de argumentos que valorizam apenas a alta complexidade."
},
{
  tema:"Resolutividade da APS",
  caso:"Em uma aula de saúde coletiva, um estudante de medicina questiona o professor sobre por que os diagramas de organização dos sistemas de saúde costumam representar a atenção primária na base de uma pirâmide, e não no topo, já que, na opinião dele, os hospitais de alta complexidade parecem ser mais importantes por lidarem com os casos mais graves.",
  pergunta:"A justificativa mais correta para essa representação é:",
  opcoes:[
    {texto:"Porque a atenção primária é hierarquicamente menos importante que os demais níveis", correta:false, exp:"A posição na base não indica menor importância; ao contrário, reflete a função estruturante da atenção primária, responsável pela maior parte da resolutividade do sistema."},
    {texto:"Porque a atenção primária sustenta o sistema ao concentrar o maior volume e resolver a maior parte das necessidades de saúde da população", correta:true, exp:"A posição da APS na base da pirâmide reflete sua função estruturante: maior volume de atendimento e maior capacidade de resolução das demandas de saúde da população."},
    {texto:"Porque a atenção primária deve atender apenas quem não consegue pagar por planos de saúde privados", correta:false, exp:"A atenção primária, no SUS, é organizada pelo princípio da universalidade, atendendo toda a população, e não apenas quem não tem acesso a planos privados."},
    {texto:"Porque a base da pirâmide representa o nível de menor investimento necessário", correta:false, exp:"Pelo contrário, a base da pirâmide, por concentrar a maior resolutividade, deve receber investimento prioritário, e não o menor investimento do sistema."}
  ],
  raciocinio:"A posição da APS na base da pirâmide assistencial reflete sua função estruturante: maior volume de atendimento e maior capacidade de resolução das demandas de saúde da população, o que justifica o investimento prioritário nesse nível."
},
{
  tema:"Territorialização e DCNT",
  caso:"Ao revisar os registros de atendimento dos últimos dois anos da UBS Jardim Primavera, a equipe percebe aumento expressivo no número de pacientes com hipertensão e diabetes mal controlados, muitos dos quais faltam frequentemente às consultas de acompanhamento e não retiram a medicação na farmácia da unidade regularmente.",
  pergunta:"A estratégia mais alinhada aos princípios da territorialização e da abordagem comunitária para lidar com esse achado é:",
  opcoes:[
    {texto:"Aguardar que os próprios pacientes procurem a unidade espontaneamente para tratamento individual, sem qualquer ação adicional", correta:false, exp:"Uma postura apenas reativa à demanda espontânea não responde ao padrão epidemiológico identificado no diagnóstico do território, que exige ação proativa da equipe."},
    {texto:"Organizar ações em grupo, busca ativa e estratégias direcionadas às necessidades identificadas no território", correta:true, exp:"A territorialização e a abordagem comunitária orientam a equipe a responder a padrões epidemiológicos identificados no território com ações coletivas, como grupos educativos e busca ativa, além do cuidado individual."},
    {texto:"Encaminhar automaticamente todos os hipertensos e diabéticos para acompanhamento exclusivo em nível hospitalar", correta:false, exp:"Hipertensão e diabetes são condições cujo acompanhamento longitudinal é atribuição central da atenção primária; encaminhar todos os casos ao nível hospitalar contraria essa responsabilidade."},

{
  tema:"Saúde Mental - Sintomas Depressivos",
  caso:"Carla, 38 anos, auxiliar administrativa e mãe de dois filhos adolescentes, procura a UBS acompanhada do marido, que relata mudança perceptível no comportamento da esposa há cerca de cinco semanas. Segundo ele, Carla tem se sentido \"inútil\" e \"culpada por tudo que dá errado em casa\", chorando com frequência, além de ter perdido completamente o interesse em cozinhar para a família, atividade que sempre foi um prazer para ela.",
  pergunta:"Com base nos sintomas fundamentais e acessórios da depressão, essa apresentação sugere:",
  opcoes:[
    {texto:"Quadro compatível com sintoma fundamental (perda de interesse) associado a sintoma acessório (ideias de culpa/inutilidade) de depressão", correta:true, exp:"Perda de interesse é um sintoma fundamental da depressão, e ideias de culpa/inutilidade são sintomas acessórios; a combinação de ambos, por mais de duas semanas, sustenta a suspeita de episódio depressivo."},
    {texto:"Quadro de ansiedade generalizada isolada, sem relação com sintomas depressivos", correta:false, exp:"Perda de interesse e ideias de culpa/inutilidade não são característicos da ansiedade generalizada, que se manifesta principalmente por preocupação excessiva e sintomas físicos de tensão."},
    {texto:"Reação normal e esperada do dia a dia, sem qualquer significado clínico", correta:false, exp:"A persistência de perda de interesse e ideias de culpa/inutilidade por mais de um mês ultrapassa uma reação transitória do cotidiano, configurando sintomatologia clinicamente relevante."},
    {texto:"Sintomas exclusivos de transtorno do pânico", correta:false, exp:"O transtorno do pânico se caracteriza por crises episódicas de intensa ansiedade física, e não pelo quadro de perda de interesse e culpa persistentes descrito no caso."}
  ],
  raciocinio:"Perda de interesse é um sintoma fundamental da depressão, e ideias de culpa/inutilidade são sintomas acessórios; a combinação de ambos, por mais de duas semanas, sustenta a suspeita de episódio depressivo, exigindo avaliação mais aprofundada."
},
{

    {texto:"Um possível sinal de quadro depressivo, já que a perda de interesse/prazer é um sintoma fundamental que pode se sobrepor à queixa de humor triste", correta:true, exp:"A perda de interesse e a redução da iniciativa (abulia) constituem sintoma fundamental da depressão, podendo ser tão relevantes quanto o humor deprimido para caracterizar o quadro."},
    {texto:"Sinal exclusivo de transtorno de ansiedade generalizada", correta:false, exp:"A ansiedade generalizada se caracteriza por preocupação excessiva e sintomas de tensão, e não pela perda predominante de vontade e iniciativa descrita no caso."},
    {texto:"Sintoma sem qualquer relevância clínica, associado apenas à preguiça", correta:false, exp:"Interpretar a abulia apenas como preguiça, sem investigação clínica, pode levar a subdiagnóstico de um quadro depressivo relevante que exige avaliação e conduta adequadas."}

  raciocinio:"A perda de interesse e a redução da iniciativa (abulia) constituem sintoma fundamental da depressão, podendo se apresentar de forma tão relevante quanto o humor deprimido, o que exige atenção da equipe mesmo na ausência de queixa explícita de tristeza."
},
{
  tema:"Saúde Mental - Sintomas Depressivos",
  caso:"Em consulta de seguimento após seis semanas de tratamento com antidepressivo, Fernanda, 33 anos, relata que o humor melhorou bastante e que já consegue realizar suas atividades diárias com mais disposição, mas ainda mantém, de forma recorrente, pensamentos de que \"não merece ser feliz\" e de culpa excessiva por decisões tomadas no passado.",

    {texto:"Continuar monitorando ativamente os sintomas acessórios, pois indicam que a remissão ainda não é completa", correta:true, exp:"A avaliação completa da depressão inclui monitoramento de sintomas acessórios, como ideias de culpa, mesmo quando há melhora parcial do humor, pois indicam que a remissão ainda não é plena."},
    {texto:"Suspender imediatamente o tratamento, já que houve alguma melhora", correta:false, exp:"Suspender o tratamento diante de sintomas acessórios ainda presentes aumenta o risco de recaída e não corresponde à conduta adequada nas fases de manutenção e continuação do tratamento."},
    {texto:"Ignorar os pensamentos de culpa, pois não fariam parte dos critérios diagnósticos de depressão", correta:false, exp:"Ideias de culpa e inutilidade são reconhecidas como sintomas acessórios da depressão e devem ser ativamente monitoradas, e não ignoradas na avaliação do quadro."}

  raciocinio:"A avaliação completa da depressão inclui o monitoramento de sintomas acessórios, como ideias de culpa e inutilidade, mesmo diante de melhora parcial do humor, pois sua persistência indica que a remissão ainda não é completa."
},

  ],
  raciocinio:"Aos 3 anos, espera-se que a criança suba escadas, forme frases completas e brinque com outras crianças; a ausência simultânea desses marcos, na ausência de comorbidades prévias, sugere atraso em múltiplos domínios do desenvolvimento e exige investigação adicional."

{

{

  raciocinio:"Ampliar horários e reorganizar o acolhimento tem como objetivo reduzir barreiras e fortalecer o acesso de primeiro contato, permitindo que a população busque a unidade sempre que surgir uma nova necessidade de saúde."
},
{
  tema:"Atributos da APS - Acesso",
  caso:"Durante uma aula de introdução à Medicina de Família e Comunidade, um estudante pergunta ao professor qual é, na prática, a diferença entre os termos \"acesso\" e \"acessibilidade\" frequentemente citados nos textos sobre atenção primária à saúde.",
  pergunta:"A definição mais adequada é:",
  opcoes:[
    {texto:"Acessibilidade se refere apenas a horários de funcionamento, enquanto acesso envolve exclusivamente a distância geográfica", correta:false, exp:"Acessibilidade envolve mais do que apenas horários, incluindo localização, acolhimento e barreiras físicas, culturais e administrativas; e acesso não se resume à distância geográfica."},
    {texto:"Acessibilidade envolve horários, localização, acolhimento e barreiras físicas/culturais/administrativas; o acesso oportuno busca organizar resposta compatível com a necessidade, indo além do simples agendamento", correta:true, exp:"Acesso não se resume a horário; envolve acessibilidade (barreiras físicas, culturais, administrativas) e acesso oportuno (resposta compatível com a necessidade), além de acolhimento e continuidade."},
    {texto:"Os dois termos são sinônimos e não possuem qualquer diferença conceitual", correta:false, exp:"Acesso e acessibilidade possuem nuances conceituais distintas: acessibilidade trata das condições estruturais e de barreiras, enquanto acesso envolve a organização da resposta à necessidade de saúde."},
    {texto:"Acesso se refere apenas à presença física do paciente na unidade, sem qualquer relação com a resposta ao problema apresentado", correta:false, exp:"O acesso vai além da simples presença física; envolve também o acesso oportuno, ou seja, uma resposta organizada e compatível com a necessidade apresentada pelo paciente."}
  ],
  raciocinio:"Acesso não se resume a horário de funcionamento; envolve acessibilidade (horários, localização, acolhimento, barreiras físicas, culturais e administrativas) e acesso oportuno (organizar resposta compatível com a necessidade), sendo conceitos complementares, mas distintos."
},
{
  tema:"Atributos da APS - Acesso",
