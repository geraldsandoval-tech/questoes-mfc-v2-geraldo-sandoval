/* =========================================================
   MOTOR DO QUIZ
   ========================================================= */
const TOTAL = QUESTIONS.length;
let session = null; // {order, altOrders, answers, currentPos}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newSession(){
  const order = shuffleArray(QUESTIONS.map((_,i)=>i));
  const altOrders = {};
  QUESTIONS.forEach((q,qi)=>{
    altOrders[qi] = shuffleArray(q.opcoes.map((_,i)=>i));
  });
  const answers = {};
  QUESTIONS.forEach((_,qi)=>{
    answers[qi] = {selectedShuffledIdx:null, confirmed:false, skipped:false};
  });
  session = {order, altOrders, answers, currentPos:0};
}

function currentQIndex(){ return session.order[session.currentPos]; }

/* ---------- RENDER: INTRO ---------- */
function renderIntro(){
  document.getElementById('screenIntro').classList.remove('hidden');
  document.getElementById('screenQuiz').classList.add('hidden');
  document.getElementById('screenResults').classList.add('hidden');
  document.getElementById('headerActions').innerHTML = '';

  const temas = [...new Set(QUESTIONS.map(q=>q.tema))];
  document.getElementById('screenIntro').innerHTML = `
    <div class="intro">
      <h1>Simulado de Medicina de Família e Comunidade</h1>
      <div class="intro-stats">
        <div class="intro-stat"><div class="num">70</div><div class="lbl">Questões</div></div>
        <div class="intro-stat"><div class="num">4</div><div class="lbl">Alternativas cada</div></div>
        <div class="intro-stat"><div class="num">19</div><div class="lbl">Eixos temáticos</div></div>
      </div>
      <div class="intro-themes">
        ${temas.map(t=>`<div>▪ ${t}</div>`).join('')}
      </div>
      <button class="btn-primary" style="font-size:15px;padding:13px 28px;" onclick="startQuiz()">Iniciar Simulado</button>
    </div>
  `;
}

function startQuiz(){
  newSession();
  renderQuiz();
}

/* ---------- RENDER: HEADER ACTIONS (during quiz) ---------- */
function renderHeaderActions(){
  document.getElementById('headerActions').innerHTML = `
    <button class="btn-ghost btn-sm" onclick="confirmRestart()">Reiniciar</button>
  `;
}

function confirmRestart(){
  showConfirmModal(
    'Reiniciar simulado',
    'Reiniciar o simulado do zero? Todas as respostas atuais serão perdidas.',
    ()=>{
      newSession();
      renderQuiz();
    }
  );
}

/* ---------- STATUS HELPERS ---------- */
function qStatus(qi){
  const a = session.answers[qi];
  if(a.confirmed) return 'answered';
  if(a.skipped) return 'skipped';
  return 'unanswered';
}
function countStatus(){
  let answered=0, skipped=0, unanswered=0;
  session.order.forEach(qi=>{
    const s = qStatus(qi);
    if(s==='answered') answered++;
    else if(s==='skipped') skipped++;
    else unanswered++;
  });
  return {answered,skipped,unanswered};
}

/* ---------- RENDER: QUIZ SCREEN ---------- */
function renderQuiz(){
  document.getElementById('screenIntro').classList.add('hidden');
  document.getElementById('screenResults').classList.add('hidden');
  const el = document.getElementById('screenQuiz');
  el.classList.remove('hidden');
  renderHeaderActions();

  const qi = currentQIndex();
  const q = QUESTIONS[qi];
  const ans = session.answers[qi];
  const {answered,skipped,unanswered} = countStatus();
  const pos = session.currentPos;

  // progress bar segments
  const pctAns = (answered/TOTAL*100).toFixed(2);
  const pctSkip = (skipped/TOTAL*100).toFixed(2);
  const pctUn = (unanswered/TOTAL*100).toFixed(2);

  let bodyHtml = `
    <div class="progress-wrap">
      <div class="progress-top">
        <div class="progress-label">QUESTÃO ${pos+1} DE ${TOTAL}</div>
        <div class="progress-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--ok)"></span>Respondidas: ${answered}</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span>Puladas: ${skipped}</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--text-faint)"></span>Restantes: ${unanswered}</span>
        </div>
      </div>
      <div class="bar-track">
        <div class="bar-seg" style="width:${pctAns}%;background:var(--ok)"></div>
        <div class="bar-seg" style="width:${pctSkip}%;background:var(--warn)"></div>
        <div class="bar-seg" style="width:${pctUn}%;background:var(--bg-panel-2)"></div>
      </div>
    </div>

    <div class="card">
      <div class="qnum">QUESTÃO ${pos+1}</div>
      ${q.caso ? `<div class="caso-box"><div class="caso-label">Caso clínico</div>${q.caso}</div>` : ''}
      <div class="pergunta">${q.pergunta}</div>
      <div class="opcoes" id="opcoesContainer"></div>
      <div id="feedbackContainer"></div>
    </div>

    <div class="navbar">
      <div class="navbar-left">
        <button class="btn-secondary" onclick="goPrev()" ${pos===0?'disabled':''}>← Anterior</button>
        <button class="btn-ghost" onclick="skipCurrent()" ${ans.confirmed?'disabled':''}>Pular</button>
      </div>
      <div class="navbar-right">
        <button class="btn-secondary" onclick="goNext()" ${pos===TOTAL-1?'disabled':''}>Próxima →</button>
        <button class="btn-danger" onclick="tryFinish()">Finalizar simulado</button>
      </div>
    </div>
  `;
  el.innerHTML = bodyHtml;
  renderOpcoes();
}

function renderOpcoes(){
  const qi = currentQIndex();
  const q = QUESTIONS[qi];
  const ans = session.answers[qi];
  const order = session.altOrders[qi]; // array of original opt indices in shuffled display order
  const container = document.getElementById('opcoesContainer');
  const letters = ['A','B','C','D'];

  let html = '';
  order.forEach((origOptIdx, displayIdx)=>{
    const opt = q.opcoes[origOptIdx];
    const isSelected = ans.selectedShuffledIdx === displayIdx;
    let cls = 'opcao';
    let icon = '';
    if(ans.confirmed){
      cls += ' locked';
      if(opt.correta){ cls += ' correta-reveal'; icon = '✓'; }
      else if(isSelected && !opt.correta){ cls += ' incorreta-reveal'; icon = '✗'; }
    } else if(isSelected){
      cls += ' selected';
    }
    html += `
      <div class="${cls}" onclick="${ans.confirmed?'':`selectOption(${displayIdx})`}">
        <div class="opcao-letra">${letters[displayIdx]}</div>
        <div class="opcao-texto">${opt.texto}</div>
        ${icon ? `<div class="opcao-icon">${icon}</div>` : ''}
      </div>
    `;
  });
  container.innerHTML = html;

  // feedback
  const fc = document.getElementById('feedbackContainer');
  if(ans.confirmed){
    const selectedOrigIdx = order[ans.selectedShuffledIdx];
    const selectedOpt = q.opcoes[selectedOrigIdx];
    const isCorrect = selectedOpt.correta;
    let expHtml = '';
    order.forEach((origOptIdx, displayIdx)=>{
      const opt = q.opcoes[origOptIdx];
      expHtml += `<div class="alt-exp"><b>${letters[displayIdx]}.</b> ${opt.texto} — ${opt.exp}</div>`;
    });
    fc.innerHTML = `
      <div class="feedback ${isCorrect?'correct':'incorrect'}">
        <div class="feedback-title">${isCorrect?'✓ Resposta correta':'✗ Resposta incorreta'}</div>
        <div class="feedback-block">
          <div class="feedback-label">Raciocínio</div>
          <div class="feedback-text">${q.raciocinio}</div>
        </div>
        <div class="feedback-block">
          <div class="feedback-label">Análise de todas as alternativas</div>
          ${expHtml}
        </div>
      </div>
    `;
  } else {
    fc.innerHTML = '';
  }
}

function selectOption(displayIdx){
  const qi = currentQIndex();
  const ans = session.answers[qi];
  if(ans.confirmed) return;
  ans.selectedShuffledIdx = displayIdx;
  ans.skipped = false;
  ans.confirmed = true; // clicar na alternativa já confirma a resposta
  renderQuiz();
}

function skipCurrent(){
  const qi = currentQIndex();
  const ans = session.answers[qi];
  if(ans.confirmed) return;
  ans.skipped = true;
  ans.selectedShuffledIdx = null;
  goNext(true);
}

function goNext(fromSkip){
  if(session.currentPos < TOTAL-1){
    session.currentPos++;
    renderQuiz();
  } else if(fromSkip){
    renderQuiz();
  }
}
function goPrev(){
  if(session.currentPos>0){
    session.currentPos--;
    renderQuiz();
  }
}

function tryFinish(){
  const {unanswered, skipped} = countStatus();
  const pending = unanswered + skipped;
  if(pending > 0){
    showConfirmModal(
      'Finalizar simulado',
      `Ainda há ${pending} questão(ões) não respondida(s) ou pulada(s). Elas serão contabilizadas como não respondidas no resultado final. Deseja finalizar mesmo assim?`,
      ()=>renderResults()
    );
  } else {
    renderResults();
  }
}

/* ---------- CUSTOM CONFIRM MODAL ---------- */
function showConfirmModal(title, message, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">${title}</div>
        <div class="modal-msg">${message}</div>
        <div class="modal-actions">
          <button class="btn-ghost" id="modalCancelBtn">Cancelar</button>
          <button class="btn-primary" id="modalConfirmBtn">Confirmar</button>
        </div>
      </div>
    </div>
  `;
  const overlay = document.getElementById('modalOverlay');
  const close = ()=>{ root.innerHTML = ''; };
  document.getElementById('modalCancelBtn').onclick = close;
  document.getElementById('modalConfirmBtn').onclick = ()=>{
    close();
    onConfirm();
  };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
}

/* ---------- ALLOW EDITING CONFIRMED ANSWERS (before finalize) ---------- */
// Add a small "alterar resposta" affordance: clicking a locked option before finalization reopens it.
document.addEventListener('click', function(e){
  const optEl = e.target.closest('.opcao.locked');
  if(optEl && session){
    const qi = currentQIndex();
    const ans = session.answers[qi];
    if(ans.confirmed){
      // reopen for editing
      ans.confirmed = false;
      renderOpcoes();
    }
  }
});

/* ---------- RESULTS ---------- */
function renderResults(){
  document.getElementById('screenIntro').classList.add('hidden');
  document.getElementById('screenQuiz').classList.add('hidden');
  document.getElementById('screenResults').classList.remove('hidden');
  document.getElementById('headerActions').innerHTML = '';

  let correct=0, incorrect=0, answered=0, skippedOrUn=0;
  const themeStats = {};

  QUESTIONS.forEach((q,qi)=>{
    const ans = session.answers[qi];
    if(!themeStats[q.tema]) themeStats[q.tema] = {correct:0, total:0, answered:0};
    if(ans.confirmed){
      answered++;
      const order = session.altOrders[qi];
      const selOrig = order[ans.selectedShuffledIdx];
      const isCorrect = q.opcoes[selOrig].correta;
      themeStats[q.tema].total++;
      themeStats[q.tema].answered++;
      if(isCorrect){ correct++; themeStats[q.tema].correct++; }
      else { incorrect++; }
    } else {
      skippedOrUn++;
      themeStats[q.tema].total++;
    }
  });

  const pct = answered>0 ? ((correct/answered)*100).toFixed(1) : '0.0';

  let themeHtml = '';
  Object.keys(themeStats).forEach(tema=>{
    const s = themeStats[tema];
    const p = s.answered>0 ? (s.correct/s.answered*100) : 0;
    themeHtml += `
      <div class="theme-row">
        <div class="theme-name">${tema}</div>
        <div class="theme-bar-track"><div class="theme-bar-fill" style="width:${p}%"></div></div>
        <div class="theme-count">${s.correct}/${s.answered} (${s.total} no banco)</div>
      </div>
    `;
  });

  document.getElementById('screenResults').innerHTML = `
    <div class="results">
      <h1>Resultado do Simulado</h1>
      <div class="results-grid">
        <div class="result-stat ok"><div class="num">${correct}</div><div class="lbl">Acertos</div></div>
        <div class="result-stat bad"><div class="num">${incorrect}</div><div class="lbl">Erros</div></div>
        <div class="result-stat acc"><div class="num">${pct}%</div><div class="lbl">Aproveitamento</div></div>
        <div class="result-stat"><div class="num">${answered}</div><div class="lbl">Respondidas</div></div>
        <div class="result-stat warn"><div class="num">${skippedOrUn}</div><div class="lbl">Puladas/Não respondidas</div></div>
      </div>
      <div class="theme-breakdown">
        <h2>Desempenho por eixo temático</h2>
        ${themeHtml}
      </div>
      <div class="results-actions">
        <button class="btn-secondary" onclick="renderQuiz()">Revisar questões</button>
        <button class="btn-primary" onclick="startQuiz()">Refazer simulado (nova ordem)</button>
      </div>
      <div class="footnote">A ordem das questões e das alternativas é sorteada a cada novo simulado.</div>
    </div>
  `;
}

/* ---------- INIT ---------- */
renderIntro();
</script>
